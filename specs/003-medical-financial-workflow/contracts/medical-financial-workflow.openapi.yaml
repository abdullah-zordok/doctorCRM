openapi: 3.1.0
info:
  title: Doctor Clinic Medical and Financial Workflow API
  version: 0.1.0
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
paths:
  /api/patients/{patientId}/visits:
    get:
      summary: List patient visits
      parameters:
        - $ref: '#/components/parameters/PatientId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ClinicIdQuery'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/VisitList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create medical visit
      description: Doctor-only.
      parameters:
        - $ref: '#/components/parameters/PatientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitRequest'
      responses:
        '201':
          $ref: '#/components/responses/VisitItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/visits/{id}:
    get:
      summary: Get visit
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/VisitItem'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Correct visit details
      description: Doctor-only; appends visit revision.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVisitRequest'
      responses:
        '200':
          $ref: '#/components/responses/VisitItem'
  /api/visits/{visitId}/prescriptions:
    post:
      summary: Create prescription
      description: Doctor-only.
      parameters:
        - $ref: '#/components/parameters/VisitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionInput'
      responses:
        '201':
          $ref: '#/components/responses/PrescriptionItem'
  /api/prescriptions/{id}:
    get:
      summary: Get prescription
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/PrescriptionItem'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Correct prescription
      description: Doctor-only; appends prescription revision.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrescriptionInput'
      responses:
        '200':
          $ref: '#/components/responses/PrescriptionItem'
  /api/prescriptions/{id}/pdf:
    get:
      summary: Generate prescription PDF
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: PDF document generated from stored prescription data
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /api/payments:
    get:
      summary: List payments
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/ClinicIdQuery'
        - name: patientId
          in: query
          schema:
            type: string
        - name: visitId
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/PaymentList'
    post:
      summary: Register payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
      responses:
        '201':
          $ref: '#/components/responses/PaymentItem'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/payments/{id}:
    get:
      summary: Get payment
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          $ref: '#/components/responses/PaymentItem'
    patch:
      summary: Correct payment
      description: Appends payment revision before updating current balance.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCorrectionInput'
      responses:
        '200':
          $ref: '#/components/responses/PaymentItem'
  /api/payments/reports/summary:
    get:
      summary: Doctor financial summary
      description: Doctor-only detailed revenue summary.
      parameters:
        - $ref: '#/components/parameters/ClinicIdQuery'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/FinancialSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/dashboard/doctor/summary:
    get:
      summary: Doctor dashboard summary
      description: Doctor-only clinical and financial summary.
      responses:
        '200':
          $ref: '#/components/responses/DoctorDashboard'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/dashboard/doctor/revenue:
    get:
      summary: Doctor revenue dashboard
      description: Doctor-only revenue metrics by date and clinic.
      parameters:
        - $ref: '#/components/parameters/ClinicIdQuery'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          $ref: '#/components/responses/FinancialSummary'
  /api/dashboard/doctor/today-appointments:
    get:
      summary: Doctor today's appointments dashboard
      responses:
        '200':
          $ref: '#/components/responses/AppointmentSummary'
  /api/dashboard/secretary/summary:
    get:
      summary: Secretary dashboard summary
      description: Limited operational and payment summary.
      responses:
        '200':
          $ref: '#/components/responses/SecretaryDashboard'
  /api/dashboard/secretary/today-appointments:
    get:
      summary: Secretary today's appointments dashboard
      responses:
        '200':
          $ref: '#/components/responses/AppointmentSummary'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    PatientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
    VisitId:
      name: visitId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ClinicIdQuery:
      name: clinicId
      in: query
      schema:
        type: string
    DateFrom:
      name: dateFrom
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      schema:
        type: string
        format: date
  schemas:
    ApiError:
      type: object
      required: [success, message, errors]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    Visit:
      type: object
      required: [id, patientId, clinicId, doctorId, visitDate, diagnosis, treatment, status]
      properties:
        id:
          type: string
        patientId:
          type: string
        clinicId:
          type: string
        doctorId:
          type: string
        visitDate:
          type: string
          format: date-time
        diagnosis:
          type: string
        treatment:
          type: string
        status:
          type: string
          enum: [OPEN, COMPLETED, CORRECTED]
        notes:
          type: string
    CreateVisitRequest:
      type: object
      required: [clinicId, diagnosis, treatment, visitDate]
      properties:
        clinicId:
          type: string
        diagnosis:
          type: string
        treatment:
          type: string
        visitDate:
          type: string
          format: date-time
        notes:
          type: string
    UpdateVisitRequest:
      allOf:
        - $ref: '#/components/schemas/CreateVisitRequest'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
    Medication:
      type: object
      required: [name, dosage, frequency, duration]
      properties:
        name:
          type: string
        dosage:
          type: string
        frequency:
          type: string
        duration:
          type: string
        notes:
          type: string
    Prescription:
      type: object
      required: [id, visitId, doctorId, medications, instructions, status]
      properties:
        id:
          type: string
        visitId:
          type: string
        doctorId:
          type: string
        medications:
          type: array
          items:
            $ref: '#/components/schemas/Medication'
        instructions:
          type: string
        status:
          type: string
          enum: [ACTIVE, CORRECTED, CANCELLED]
    PrescriptionInput:
      type: object
      required: [medications, instructions]
      properties:
        medications:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Medication'
        instructions:
          type: string
        reason:
          type: string
    PaymentMethod:
      type: string
      enum: [CASH, CARD, BANK_TRANSFER, OTHER]
    Payment:
      type: object
      required: [id, patientId, clinicId, totalAmount, paidAmount, remainingAmount, method, paidAt]
      properties:
        id:
          type: string
        patientId:
          type: string
        visitId:
          type: string
        clinicId:
          type: string
        totalAmount:
          type: string
          pattern: '^\\d+(\\.\\d{1,2})?$'
        paidAmount:
          type: string
          pattern: '^\\d+(\\.\\d{1,2})?$'
        remainingAmount:
          type: string
          pattern: '^\\d+(\\.\\d{1,2})?$'
        method:
          $ref: '#/components/schemas/PaymentMethod'
        paidAt:
          type: string
          format: date-time
        notes:
          type: string
    PaymentInput:
      type: object
      required: [patientId, clinicId, totalAmount, paidAmount, method]
      properties:
        patientId:
          type: string
        visitId:
          type: string
        clinicId:
          type: string
        totalAmount:
          type: string
        paidAmount:
          type: string
        method:
          $ref: '#/components/schemas/PaymentMethod'
        paidAt:
          type: string
          format: date-time
        notes:
          type: string
    PaymentCorrectionInput:
      allOf:
        - $ref: '#/components/schemas/PaymentInput'
        - type: object
          required: [reason]
          properties:
            reason:
              type: string
    DashboardMetric:
      type: object
      properties:
        label:
          type: string
        value:
          oneOf:
            - type: integer
            - type: string
    FinancialSummaryData:
      type: object
      properties:
        todayRevenue:
          type: string
        monthlyRevenue:
          type: string
        revenuePerClinic:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMetric'
        outstandingBalances:
          type: string
    DoctorDashboardData:
      type: object
      properties:
        totalPatients:
          type: integer
        todayAppointments:
          type: integer
        totalVisits:
          type: integer
        todayRevenue:
          type: string
        monthlyRevenue:
          type: string
        revenuePerClinic:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMetric'
    SecretaryDashboardData:
      type: object
      properties:
        todayAppointments:
          type: integer
        todayRegisteredPatients:
          type: integer
        todayPayments:
          type: string
        outstandingBalances:
          type: string
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Role is not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    VisitItem:
      description: Visit response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
              data:
                $ref: '#/components/schemas/Visit'
    VisitList:
      description: Paginated visit response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
              data:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Visit'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    PrescriptionItem:
      description: Prescription response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
              data:
                $ref: '#/components/schemas/Prescription'
    PaymentItem:
      description: Payment response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
              data:
                $ref: '#/components/schemas/Payment'
    PaymentList:
      description: Paginated payment response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
              data:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    FinancialSummary:
      description: Financial summary response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
              data:
                $ref: '#/components/schemas/FinancialSummaryData'
    DoctorDashboard:
      description: Doctor dashboard response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
              data:
                $ref: '#/components/schemas/DoctorDashboardData'
    SecretaryDashboard:
      description: Secretary dashboard response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
              data:
                $ref: '#/components/schemas/SecretaryDashboardData'
    AppointmentSummary:
      description: Today's appointments summary
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                const: true
              message:
                type: string
              data:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
