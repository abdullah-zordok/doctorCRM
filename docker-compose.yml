services:
  backend:
    build:
      context: ./backend
    container_name: doctor_backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: "4000"
      NODE_ENV: development
      DATABASE_URL: file:./dev.db
      JWT_SECRET: change_me_in_production
      JWT_EXPIRES_IN: 7d
      SEED_DOCTOR_EMAIL: doctor@example.com
      SEED_DOCTOR_PASSWORD: ChangeMe123!
      SEED_DOCTOR_NAME: Clinic Doctor
      SEED_SECRETARY_EMAIL: secretary@example.com
      SEED_SECRETARY_PASSWORD: ChangeMe123!
      SEED_SECRETARY_NAME: Clinic Secretary
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: pnpm dev

  frontend:
    build:
      context: ./frontend
    container_name: doctor_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: pnpm dev

volumes:
  backend_node_modules:
  frontend_node_modules:
